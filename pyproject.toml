[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embeddington"
version = "0.3.0"
description = "Install and keep current a shared Qdrant + ArangoDB knowledge graph"
requires-python = ">=3.12"
# Everything `embeddington-consume` needs to restore and apply updates.
dependencies = [
    "zstandard>=0.22",
    # Bounded to the server's minor ON PURPOSE — see consumer/docker-compose.yml, which
    # pins qdrant/qdrant to an exact patch because snapshot restore is version-sensitive.
    # An unbounded client silently drifted several minors ahead of that server and warned
    # about it on every run. tests/test_version_pins.py fails if this stops admitting the
    # pinned server's minor, so the image and the client can only move together.
    "qdrant-client>=1.16,<1.17",
    "python-arango>=8.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
setup = ["rich>=13"]
# rich repeats here because the installer test suite imports it directly and CI
# installs only [dev] — the dev env must be self-sufficient.
dev = ["pytest>=8.0", "pytest-cov>=5", "mypy>=1.0", "rich>=13"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["embeddington*", "consumer*", "installer*"]

[project.scripts]
embeddington-consume = "consumer.cli:main"
embeddington-setup = "installer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires live infra (Postgres/Qdrant/Arango/vLLM/GPU); runs only on the self-hosted Spark runner",
]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
